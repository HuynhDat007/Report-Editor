<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>PDF Report Editor (pdfmake)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js"></script>
    <link rel="stylesheet" href="editor-pdfmake.css">
</head>

<body>

    <div class="app">
        <!-- Toolbar -->
        <div class="toolbar">
            <span class="title">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: -2px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>Report Editor
            </span>
            <button class="primary" onclick="previewPDF()">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: -1px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>Preview PDF
            </button>
            <button onclick="downloadPDF()">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: -1px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>Download PDF
            </button>
            <div class="sep"></div>
            <button onclick="exportJSON()">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: -1px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>Export JSON
            </button>
            <button onclick="importJSON()">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: -1px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>Import JSON
            </button>
        </div>

        <!-- Palette -->
        <div class="palette">
            <h3>Thêm Element</h3>
            <div class="pal-item" onclick="addElement('text')"><span class="icon"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg></span> Text</div>
            <div class="pal-item" onclick="addElement('heading')"><span class="icon"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="4" x2="4" y2="20"></line><line x1="20" y1="4" x2="20" y2="20"></line><line x1="4" y1="12" x2="20" y2="12"></line></svg></span> Heading</div>
            <div class="pal-item" onclick="addElement('shape')"><span class="icon"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="2"></rect><circle cx="15" cy="15" r="6"></circle></svg></span> Hình học</div>
            <div class="pal-item" onclick="addElement('table')"><span class="icon"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="1.5"></rect><line x1="3" y1="7" x2="16" y2="7"></line><line x1="3" y1="12" x2="16" y2="12"></line><line x1="8" y1="3" x2="8" y2="16"></line></svg></span> Table</div>
            <div class="pal-item" onclick="addElement('columns')"><span class="icon"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="18" rx="1"></rect><rect x="15" y="3" width="6" height="18" rx="1"></rect></svg></span> 2 Cột</div>
            <div class="pal-item" onclick="addElement('var')"><span class="icon"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"></path><path d="M20 5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4"></path><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg></span> Variable</div>
            <div class="pal-item" onclick="addElement('image')"><span class="icon"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></span> Ảnh</div>
            <div class="pal-item" onclick="addElement('panel')"><span class="icon"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg></span> Panel</div>
            <div class="pal-item" onclick="addElement('pagebreak')"><span class="icon"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="9.8" y1="8.2" x2="22" y2="20"></line><line x1="9.8" y1="15.8" x2="22" y2="4"></line></svg></span> Ngắt trang</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin: 10px 0 6px;">
                <h3 style="margin:0;">Variables</h3>
                <button onclick="addNewVar()" onmouseover="this.style.background='#45475a';this.style.borderColor='#585b70';" onmouseout="this.style.background='#313244';this.style.borderColor='#45475a';" style="background:#313244; border:1px solid #45475a; color:#89b4fa; border-radius:4px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; transition: background 0.2s, border-color 0.2s;" title="Thêm biến mới">
                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
            <div id="varList"></div>
        </div>

        <!-- Canvas -->
        <div class="canvas-wrap" onclick="deselect(event)">
            <div class="paper" id="paper"></div>
        </div>

        <!-- Resizer -->
        <div class="resizer" id="sidebarResizer"></div>

        <!-- Properties -->
        <div class="props" id="propsPanel">
            <div class="props-section">
                <h3>Properties</h3>
                <div id="propsContent" style="color:#6c7086;">Click element để sửa</div>
            </div>
            <div class="outline-section">
                <h3>Danh sách Element</h3>
                <div id="elementsOutline" style="margin-top: 8px; display: flex; flex-direction: column; gap: 4px;">
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal-bg" id="previewModal">
        <div class="modal">
            <div class="mhead">
                <span style="font-weight:600">Preview PDF</span>
                <button onclick="closePreview()"
                    style="background:none;border:none;color:#cdd6f4;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;width:24px;height:24px;">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <iframe id="previewFrame"></iframe>
        </div>
    </div>

    <!-- Variable Modal -->
    <div class="modal-bg" id="varModal">
        <div class="modal" style="width: 400px; height: auto; max-height: 90vh; align-self: center;">
            <div class="mhead">
                <span style="font-weight:600" id="varModalTitle">Thêm Biến Mới</span>
                <button onclick="closeVarModal()"
                    style="background:none;border:none;color:#cdd6f4;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;width:24px;height:24px;">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
                <div class="prop-row">
                    <label style="width: 90px; font-size: 12px; color: #a6adc8;">Tên biến:</label>
                    <input type="text" id="varNameInput" placeholder="VD: bn_ngay_sinh" style="flex: 1;">
                </div>
                <div class="prop-row">
                    <label style="width: 90px; font-size: 12px; color: #a6adc8;">Loại data:</label>
                    <select id="varTypeSelect" onchange="onVarTypeChange()" style="flex: 1;">
                        <option value="string">Text (Chuỗi)</option>
                        <option value="array">Mảng (Danh sách)</option>
                        <option value="image">Hình ảnh (Image)</option>
                    </select>
                </div>
                <div class="prop-row" id="varTextareaRow" style="align-items: flex-start;">
                    <label style="width: 90px; font-size: 12px; color: #a6adc8; margin-top: 4px;">Data mẫu:</label>
                    <textarea id="varValueInput" placeholder="Nhập giá trị mẫu"
                        style="flex: 1; height: 100px; resize: vertical;"></textarea>
                </div>
                <!-- Image data type inputs -->
                <div id="varImageInputs" style="display: none; flex-direction: column; gap: 12px;">
                    <div class="prop-row">
                        <label style="width: 90px; font-size: 12px; color: #a6adc8;">Đường dẫn (URL):</label>
                        <input type="text" id="varImageUrlInput" placeholder="Nhập URL hoặc tự tải file bên dưới"
                            style="flex: 1;" oninput="onVarImageUrlInput()">
                    </div>
                    <div class="prop-row">
                        <label style="width: 90px; font-size: 12px; color: #a6adc8;">Tải ảnh local:</label>
                        <input type="file" id="varImageFileInput" accept="image/*,image/svg+xml"
                            onchange="onVarImageFileChange(event)" style="display:none;">
                        <button onclick="document.getElementById('varImageFileInput').click()"
                            style="width: auto; padding: 6px 12px; border: 1px solid #585b70; background: #313244; color: #cdd6f4; border-radius: 6px; cursor: pointer; font-size: 12px;">Chọn
                            file ảnh...</button>
                    </div>
                    <div class="prop-row" style="align-items: flex-start;">
                        <label style="width: 90px; font-size: 12px; color: #a6adc8; margin-top: 4px;">Xem trước:</label>
                        <div
                            style="flex: 1; border: 1px solid #45475a; border-radius: 4px; background: #11111b; height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;">
                            <img id="varImagePreview" src=""
                                style="max-width: 100%; max-height: 100%; object-fit: contain; display: none;">
                            <span id="varImagePreviewPlaceholder" style="color: #6c7086; font-size: 11px;">Chưa có
                                ảnh</span>
                        </div>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;">
                    <button onclick="closeVarModal()"
                        style="width: auto; padding: 6px 12px; border: 1px solid #585b70; background: #313244; color: #cdd6f4; border-radius: 6px; cursor: pointer;">Hủy</button>
                    <button onclick="saveVar()"
                        style="width: auto; padding: 6px 12px; border: 1px solid #89b4fa; background: #89b4fa; color: #1e1e2e; font-weight: 600; border-radius: 6px; cursor: pointer;">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)">

    <script src="editor-pdfmake.js"></script>
</body>

</html>
